name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_install:
        description: "Also install the starter profile for real on the runner"
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash -x -P SCRIPTDIR bin/cgp-ai lib/*.sh install.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the saved selection inside the runner's temp folder
        run: echo "CGP_AI_HOME=$RUNNER_TEMP/cgp-ai" >> "$GITHUB_ENV"
      - name: Plan for each AI choice and profile
        run: |
          for ai in claude openai both; do
            bin/cgp-ai setup --ai "$ai" --profile starter --dry-run
          done
          bin/cgp-ai setup --ai both --profile builder --dry-run --yes
          bin/cgp-ai setup --ai both --profile builder --with docker-desktop --dry-run --yes
      - name: Doctor without a selection reports it and fails
        run: |
          if bin/cgp-ai doctor; then echo "doctor should fail without a selection"; exit 1; fi
      - name: Install the starter profile
        if: ${{ inputs.full_install }}
        run: |
          # Nobody can sign in on a CI runner, so setup ends with the sign-ins
          # still open and exits 1. Only missing installations count here.
          bin/cgp-ai setup --ai both --profile starter --yes | tee setup.log || true
          grep -q "Not finished yet" setup.log
          bin/cgp-ai doctor | tee doctor.log || true
          if grep -E "is missing|not installed" doctor.log; then exit 1; fi
          grep -q "Sign in to Claude Code CLI: still open" doctor.log
